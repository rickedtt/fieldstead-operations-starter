name: Build Windows desktop artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled production server
        run: npm run desktop:prepare-server

      - name: Validate package contract
        run: npm run package:validate

      - name: Build primary Windows installer
        run: npx electron-builder --publish never --win nsis --x64

      - name: Verify primary Windows installer
        run: npm run installer:verify

      - name: Build portable diagnostic fallback
        run: npx electron-builder --publish never --win portable --x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fieldstead-windows-installer-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/*Setup*.exe
            release/*.yml

      - name: Upload portable diagnostic fallback
        uses: actions/upload-artifact@v4
        with:
          name: fieldstead-windows-portable-fallback-${{ github.sha }}
          if-no-files-found: error
          path: release/*Portable*.exe
