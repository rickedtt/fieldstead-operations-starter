name: Build and publish desktop releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        default: 'v0.2.8'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare-server
      - run: npx electron-builder --publish never --linux AppImage --x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare-server
      - run: npx electron-builder --publish never --win portable nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*Portable*.exe
            release/*Setup*.exe
            release/*.yml

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          find release-assets -type f -print
          gh release create "$TAG" release-assets/linux-release/* release-assets/windows-release/* \
            --repo "$REPO" \
            --title "Fieldstead Systems Operations Starter $TAG" \
            --generate-notes
