name: Build and publish desktop releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate tag matches package version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "const p=require('./package.json'); if(process.env.TAG !== 'v'+p.version) throw new Error('Release tag must be v'+p.version)"
      - run: npm run desktop:prepare-server
      - run: npx electron-builder --publish never --linux AppImage --x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare-server
      - run: npm run package:validate
      - run: npx electron-builder --publish never --win nsis --x64
      - run: npm run installer:verify
      - run: npx electron-builder --publish never --win portable --x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*Portable*.exe
            release/*Setup*.exe
            release/*.yml

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          find release-assets -type f -print
          gh release create "$TAG" release-assets/linux-release/* release-assets/windows-release/* \
            --repo "$REPO" \
            --title "Fieldstead Systems Operations Starter $TAG" \
            --generate-notes
