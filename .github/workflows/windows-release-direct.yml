name: Publish Windows release directly

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 8
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate tag matches package version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "const p=require('./package.json'); if(process.env.TAG !== 'v'+p.version) throw new Error('Release tag must be v'+p.version)"

      - name: Prepare bundled production server
        run: npm run desktop:prepare-server

      - name: Validate package contract
        run: npm run package:validate

      - name: Build primary Windows installer
        run: npx electron-builder --publish never --win nsis --x64

      - name: Verify primary Windows installer
        run: npm run installer:verify

      - name: Verify Windows installer artifact
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem release -Filter *Setup*.exe)
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one NSIS setup installer.' }
          $bytes = [System.IO.File]::ReadAllBytes($artifacts[0].FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$($artifacts[0].Name) is not a Windows PE file." }
          Get-FileHash $artifacts[0].FullName -Algorithm SHA256

      - name: Create or update public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "Fieldstead Systems Operations Starter $TAG" --notes "Windows release for $TAG."
          for asset in release/*Setup*.exe release/*.yml; do
            name=$(basename "$asset")
            gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes 2>/dev/null || true
            gh release upload "$TAG" "$asset" --repo "$REPO" --clobber
          done
