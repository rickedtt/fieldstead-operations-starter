name: Publish Windows release directly

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish'
        required: true
        default: 'v0.2.25'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled production server
        run: npm run desktop:prepare-server

      - name: Build Windows installer and portable executable
        run: npx electron-builder --publish never --win nsis portable --x64

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem release -Filter *.exe)
          if ($artifacts.Count -lt 2) { throw 'Expected both Windows EXE artifacts.' }
          foreach ($artifact in $artifacts) {
            $bytes = [System.IO.File]::ReadAllBytes($artifact.FullName)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$($artifact.Name) is not a Windows PE file." }
            Get-FileHash $artifact.FullName -Algorithm SHA256
          }

      - name: Create or update private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "Fieldstead Systems Operations Starter $TAG" --notes "Windows release for $TAG."
          for asset in release/*Portable*.exe release/*Setup*.exe release/*.yml; do
            name=$(basename "$asset")
            gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes 2>/dev/null || true
            gh release upload "$TAG" "$asset" --repo "$REPO" --clobber
          done
